# Revisa cada rama y cada pull request: lint, tipos, pruebas, formato y build.
name: CI
#Establece el directorio a ejecutar de manera directa sin mover todo el proyecto a otra carpeta
defaults.run.working-directory: PWA/rokola-base/rokola-base

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

