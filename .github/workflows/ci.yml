# Revisa cada rama y cada pull request: lint, tipos, pruebas, formato y build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# El proyecto vive en rokola-base/: todos los comandos `run` se ejecutan ahí.
defaults:
  run:
    working-directory: rokola-base

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # `uses` no respeta working-directory: las rutas van desde la raíz del repositorio.
          node-version-file: rokola-base/.nvmrc
          cache: npm
          cache-dependency-path: rokola-base/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
